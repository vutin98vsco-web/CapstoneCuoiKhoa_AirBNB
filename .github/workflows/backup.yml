name: Encrypted PostgreSQL backup
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgres-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/backup-postgres.mjs --docker --verify-restore --output .backups/postgres-${{ github.run_id }}.tnbackup
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-postgres-${{ github.run_id }}
          path: .backups/*.tnbackup
          retention-days: 7
          if-no-files-found: error
